<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formula Vault — Vectors & 3D Geometry</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg: #070b12;
  --bg2: #0b111c;
  --card: #0f1726;
  --card2: #141e30;
  --border: #1a263c;
  --fg: #e2e8f0;
  --muted: #64748b;
  --accent: #6366f1; /* Indigo Accent */
  --accent-glow: rgba(99, 102, 241, 0.08);
  --accent-glow-active: rgba(99, 102, 241, 0.16);
  --accent-mark: rgba(99, 102, 241, 0.3);
  --radius: 10px;
  --tip-bg: rgba(245, 158, 11, 0.06);
  --tip-border: rgba(245, 158, 11, 0.25);
  --tip-text: #f59e0b;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at 20% 0%, var(--accent-glow), transparent 60%),
              radial-gradient(ellipse at 80% 100%, rgba(0, 196, 255, 0.03), transparent 60%);
  pointer-events: none;
  z-index: 0;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #22324f; }

#sidebar {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: 290px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  z-index: 100;
  display: flex;
  flex-direction: column;
  transition: transform .3s ease;
}

.sidebar-head {
  padding: 1.25rem;
  border-bottom: 1px solid var(--border);
}

.sidebar-head h2 {
  font-size: 1.12rem;
  font-weight: 700;
  letter-spacing: -.02em;
  display: flex;
  align-items: center;
  gap: .55rem;
}

.sidebar-head h2 i {
  color: var(--accent);
  font-size: 1.05rem;
}

.sidebar-head .sub {
  font-size: .72rem;
  color: var(--muted);
  margin-top: .25rem;
  letter-spacing: .02em;
}

.search-box {
  padding: .85rem 1rem .5rem 1rem;
  position: relative;
}

.search-box i {
  position: absolute;
  left: 1.75rem;
  top: 52%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: .8rem;
}

.search-box input {
  width: 100%;
  padding: .55rem .75rem .55rem 2.25rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--fg);
  font-family: inherit;
  font-size: .82rem;
  outline: none;
  transition: border-color .2s;
}

.search-box input:focus { border-color: var(--accent); }

.nav-back-wrap {
  padding: 0 1rem .75rem 1rem;
}

.sidebar-actions {
  padding: 1rem;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: .5rem;
  margin-top: auto;
}

.action-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .55rem;
  padding: .62rem;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--fg);
  font-family: inherit;
  font-size: .82rem;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s;
  text-decoration: none;
}

.action-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-glow);
}

.action-btn.active {
  background: var(--accent-glow-active);
  border-color: var(--accent);
  color: var(--accent);
}

#menuBtn {
  display: none;
  position: fixed;
  top: 1rem;
  left: 1rem;
  z-index: 200;
  width: 40px;
  height: 40px;
  border-radius: 8px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--fg);
  font-size: 1rem;
  cursor: pointer;
  align-items: center;
  justify-content: center;
}

#overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 90;
}

#main {
  margin-left: 290px;
  padding: 2rem 2.75rem 4rem;
  position: relative;
  z-index: 1;
  min-height: 100vh;
}

.hero {
  display: flex;
  gap: 1.25rem;
  margin-bottom: 2rem;
}

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.35rem;
  flex: 1;
  min-width: 140px;
  transition: border-color .2s;
}

.stat-card:hover { border-color: rgba(255, 255, 255, .15); }

.stat-card .sc-label {
  font-size: .7rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 600;
}

.stat-card .sc-val {
  font-size: 1.75rem;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  margin-top: .25rem;
  color: var(--accent);
}

.subject-header {
  margin-bottom: 1.75rem;
}

.subject-header h1 {
  font-size: 1.85rem;
  font-weight: 800;
  letter-spacing: -.03em;
  display: flex;
  align-items: center;
  gap: .65rem;
}

.subject-header h1 i {
  color: var(--accent);
  font-size: 1.35rem;
}

.subject-header p {
  color: var(--muted);
  font-size: .92rem;
  margin-top: .45rem;
  line-height: 1.5;
}

.section { margin-bottom: 1rem; }

.section-header {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .9rem 1.15rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 3.5px solid var(--accent) !important;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all .2s;
  user-select: none;
}

.section-header:hover {
  background: var(--card2);
  border-color: rgba(255, 255, 255, .12);
}

.section-header.open {
  border-radius: var(--radius) var(--radius) 0 0;
  border-bottom-color: transparent;
  background: var(--card2);
}

.section-header .sh-icon {
  color: var(--accent);
  font-size: .75rem;
  transition: transform .2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.section-header.open .sh-icon { transform: rotate(90deg); }

.section-header .sh-title {
  font-size: .95rem;
  font-weight: 600;
  flex: 1;
}

.section-header .sh-count {
  font-size: .75rem;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  margin-right: .35rem;
}

.section-header .sh-arrow {
  color: var(--muted);
  font-size: .7rem;
  transition: transform .25s;
}

.section-header.open .sh-arrow { transform: rotate(180deg); }

.section-body {
  overflow: hidden;
  max-height: 0;
  transition: max-height .35s ease;
  border: 1px solid transparent;
  border-top: none;
  border-radius: 0 0 var(--radius) var(--radius);
}

.section-body.open {
  max-height: 14000px;
  border-color: var(--border);
  background: var(--bg2);
}

.formula-grid {
  padding: .75rem;
  display: flex;
  flex-direction: column;
  gap: .5rem;
}

.formula-card {
  display: flex;
  flex-direction: column;
  gap: .25rem;
  padding: .85rem 1rem;
  background: rgba(255, 255, 255, .015);
  border: 1px solid rgba(255, 255, 255, .035);
  border-radius: 8px;
  cursor: pointer;
  transition: all .2s;
  position: relative;
}

.formula-card:hover {
  background: rgba(255, 255, 255, .035);
  border-color: rgba(255, 255, 255, .08);
}

.fc-main-row {
  display: flex;
  align-items: baseline;
  gap: 1.5rem;
  width: 100%;
}

.formula-card .fc-name {
  font-size: .82rem;
  color: var(--muted);
  width: 220px;
  flex-shrink: 0;
  font-weight: 500;
}

.formula-card .fc-formula {
  font-family: 'JetBrains Mono', monospace;
  font-size: .84rem;
  font-weight: 500;
  color: var(--fg);
  line-height: 1.5;
  word-break: break-word;
  flex-grow: 1;
}

.formula-card .fc-exp {
  font-size: 0.74rem;
  color: #94a3b8;
  margin-top: 0.25rem;
  line-height: 1.45;
  padding-left: 220px;
}
.formula-card .fc-exp i { color: var(--accent); margin-right: 0.35rem; }

.formula-card .fc-copy {
  position: absolute;
  top: .6rem;
  right: .65rem;
  opacity: 0;
  font-size: .65rem;
  color: var(--muted);
  transition: opacity .15s;
}

.formula-card .fc-star {
  position: absolute;
  top: .6rem;
  right: 1.85rem;
  opacity: 0;
  font-size: .75rem;
  color: #ffb81c;
  transition: opacity 0.15s;
}

.formula-card:hover .fc-copy, .formula-card:hover .fc-star { opacity: 1; }
.formula-card .fc-star.active { opacity: 1 !important; }

.jee-tip {
  margin: .35rem .75rem .75rem;
  padding: .65rem .9rem;
  background: var(--tip-bg);
  border: 1px solid var(--tip-border);
  border-radius: 8px;
  font-size: .78rem;
  color: var(--tip-text);
  line-height: 1.55;
  display: flex;
  gap: .5rem;
  align-items: flex-start;
}

.jee-tip i { margin-top: 2px; flex-shrink: 0; }

.master-sheet { margin-top: 2rem; display: none; }
.master-sheet.show-master { display: block !important; }

.master-sheet h2 {
  font-size: 1.15rem;
  font-weight: 700;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: .5rem;
}

.master-sheet h2 i { color: var(--accent); }

.master-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: .5rem;
}

.master-card {
  display: flex;
  gap: .6rem;
  padding: .65rem .8rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: all .2s;
}

.master-card:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}

.master-card .mc-concept {
  font-size: .72rem;
  color: var(--muted);
  min-width: 120px;
  flex-shrink: 0;
  font-weight: 500;
}

.master-card .mc-formula {
  font-family: 'JetBrains Mono', monospace;
  font-size: .78rem;
  line-height: 1.5;
}

mark {
  background: var(--accent-mark);
  color: var(--fg);
  border-radius: 2px;
  padding: 0 2px;
}

#toast {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  padding: .65rem 1.1rem;
  background: var(--card2);
  border: 1px solid var(--accent);
  border-radius: 8px;
  font-size: .8rem;
  color: var(--accent);
  z-index: 500;
  opacity: 0;
  transform: translateY(10px);
  transition: all .25s;
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: .5rem;
}

#toast.show { opacity: 1; transform: translateY(0); }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}

.modal-overlay.show { opacity: 1; pointer-events: auto; }

.modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2rem;
  max-width: 500px;
  width: 90%;
  text-align: center;
  transform: scale(.9);
  transition: transform .25s;
}

.modal-overlay.show .modal { transform: scale(1); }

.modal .modal-subject {
  font-size: .72rem;
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: .5rem;
}

.modal .modal-name {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 1.25rem;
}

.modal .modal-formula {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.25rem;
  font-weight: 600;
  padding: 1.25rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.modal .modal-formula.hidden-f { filter: blur(8px); user-select: none; }

.modal .modal-btns { display: flex; gap: .75rem; justify-content: center; }

.modal .modal-btns button {
  padding: .55rem 1.25rem;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--fg);
  font-family: inherit;
  font-size: .82rem;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s;
}

.modal .modal-btns button:hover { border-color: var(--accent); color: var(--accent); }
.modal .modal-btns button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

#backTop {
  position: fixed;
  bottom: 2rem;
  left: 310px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 50;
  opacity: 0;
  transition: all .25s;
  font-size: .85rem;
}

#backTop.show { opacity: 1; }
#backTop:hover { color: var(--accent); border-color: var(--accent); }

@media(max-width:860px){
  #sidebar { transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); }
  #menuBtn { display: flex; }
  #main { margin-left: 0; padding: 1.25rem 1rem 3rem; padding-top: 3.5rem; }
  #backTop { left: 1rem; bottom: 1rem; }
  .hero { gap: .6rem; }
  .formula-card .fc-main-row { flex-direction: column; gap: .25rem; }
  .formula-card .fc-name { width: unset; }
  .formula-card .fc-exp { padding-left: 0; }
  .master-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<button id="menuBtn" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
<div id="overlay"></div>

<aside id="sidebar">
  <div class="sidebar-head">
    <h2><i class="fa-solid fa-cube"></i> Formula Vault</h2>
    <div class="sub">JEE Main & Advanced — Complete Reference</div>
  </div>
  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" id="searchInput" placeholder="Search formulas, topics..." aria-label="Search formulas">
  </div>
  <div class="nav-back-wrap">
     <a href="../index.html" class="action-btn"><i class="fa-solid fa-arrow-left"></i> Back to Portal</a>
  </div>
  <div class="sidebar-actions">
    <button class="action-btn" id="qrBtn"><i class="fa-solid fa-bolt"></i> Quick Revision</button>
    <button class="action-btn" id="randomBtn"><i class="fa-solid fa-shuffle"></i> Random Formula</button>
    <button class="action-btn" id="expandBtn"><i class="fa-solid fa-expand"></i> Expand All</button>
  </div>
</aside>

<main id="main"></main>

<div id="toast"><i class="fa-solid fa-check"></i> <span id="toastMsg">Copied!</span></div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-subject" id="modalSubject"></div>
    <div class="modal-name" id="modalName"></div>
    <div class="modal-formula hidden-f" id="modalFormula">—</div>
    <div class="modal-btns">
      <button id="modalReveal">Reveal</button>
      <button id="modalNext" class="primary">Next</button>
    </div>
  </div>
</div>
<button id="backTop" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>

<script>
const FORMULA_DATA = {
  id: 'vectors-3d',
  ti: 'Vectors & 3D Geometry',
  ic: 'fa-solid fa-cube',
  c: '#6366f1',
  d: 'Comprehensive reference covering Vector Algebra, STP, VTP, Lines, Planes, and Point-Plane interactions.',
  sections: [
    {
      s: 'Vector Fundamentals & Dot Product',
      t: 'Dot product is commutative: a · b = b · a. Perpendicular vectors have a · b = 0.',
      i: [
        { n: 'Dot Product', f: 'a · b = |a| |b| cos θ = a₁b₁ + a₂b₂ + a₃b₃', qr: true, e: 'Scalar product; angle θ = cos⁻¹((a · b) / (|a||b|)).' },
        { n: 'Scalar Projection of a on b', f: 'proj_b(a) = (a · b) / |b|', qr: true, e: 'Magnitude of vector a projected along direction of b.' },
        { n: 'Vector Projection of a on b', f: 'proj_vec = [(a · b) / |b|²] b', qr: true, e: 'Vector component parallel to b.' },
        { n: 'Perpendicular Component', f: 'a_perp = a - [(a · b) / |b|²] b', e: 'Vector component of a orthogonal to b.' },
        { n: 'Cauchy-Schwarz Inequality', f: '(a · b)² <= |a|² |b|²', qr: true, e: 'Equality holds if and only if vectors a and b are collinear.' },
        { n: 'Section Formula (Vectors)', f: 'r = (m b + n a) / (m + n)', e: 'Divides line segment joining position vectors a and b in ratio m:n.' },
        { n: 'Linear Combination Condition', f: 'r = x a + y b + z c', e: 'Expresses coplanar vector r as linear combination of non-collinear basis.' }
      ]
    },
    {
      s: 'Cross Product & Geometry',
      t: 'Cross product is anti-commutative: a × b = -(b × a). Parallel vectors satisfy a × b = 0.',
      i: [
        { n: 'Cross Product Formula', f: 'a × b = | î ĵ k̂ ; a₁ a₂ a₃ ; b₁ b₂ b₃ | = |a| |b| sin θ n̂', qr: true, e: 'Vector perpendicular to both a and b by right-hand thumb rule.' },
        { n: 'Lagrange\'s Identity', f: '|a × b|² = |a|² |b|² - (a · b)²', qr: true, e: 'Connects dot and cross product magnitudes directly.' },
        { n: 'Area of Triangle (Vectors)', f: 'Area = ½ |a × b| = ½ |AB × AC|', qr: true, e: 'Area formed by coterminous vector sides.' },
        { n: 'Area of Parallelogram', f: 'Area = |a × b| = ½ |d₁ × d₂|', qr: true, e: 'Given adjacent sides a, b or diagonal vectors d₁, d₂.' },
        { n: 'Unit Normal Vector', f: 'n̂ = ± (a × b) / |a × b|', qr: true, e: 'Unit vector perpendicular to the plane containing a and b.' },
        { n: 'Collinear Points Condition', f: 'AB × AC = 0', e: 'Three points A, B, C are collinear if cross product of vectors is zero vector.' }
      ]
    },
    {
      s: 'Triple Products (STP & VTP)',
      t: 'Volume of parallelopiped = [a b c]. Cyclic permutation preserves sign: [a b c] = [b c a] = [c a b].',
      i: [
        { n: 'Scalar Triple Product (STP)', f: '[a b c] = a · (b × c) = | a₁ a₂ a₃ ; b₁ b₂ b₃ ; c₁ c₂ c₃ |', qr: true, e: 'Signed volume of parallelopiped with coterminous edges a, b, c.' },
        { n: 'Coplanarity of 3 Vectors', f: '[a b c] = 0', qr: true, e: 'Three vectors are coplanar if and only if their STP vanishes.' },
        { n: 'Volume of Tetrahedron', f: 'V = (1/6) |[a b c]|', qr: true, e: 'Volume bounded by four triangular faces.' },
        { n: 'Vector Triple Product (VTP)', f: 'a × (b × c) = (a · c) b - (a · b) c', qr: true, e: 'BAC-CAB rule: vector lies in plane of b and c, perpendicular to a.' },
        { n: 'Jacobi\'s Identity', f: 'a × (b × c) + b × (c × a) + c × (a × b) = 0', e: 'Fundamental cyclic identity for vector triple products.' }
      ]
    },
    {
      s: 'Reciprocal System of Vectors',
      t: 'Reciprocal vectors satisfy a · a\' = b · b\' = c · c\' = 1 and [a\' b\' c\'] = 1 / [a b c].',
      i: [
        { n: 'Reciprocal Vector a\'', f: 'a\' = (b × c) / [a b c]', qr: true, e: 'Vector orthogonal to b and c such that a · a\' = 1.' },
        { n: 'Reciprocal Vector b\'', f: 'b\' = (c × a) / [a b c]', qr: true, e: 'Vector orthogonal to c and a such that b · b\' = 1.' },
        { n: 'Reciprocal Vector c\'', f: 'c\' = (a × b) / [a b c]', qr: true, e: 'Vector orthogonal to a and b such that c · c\' = 1.' },
        { n: 'Box Product of Reciprocals', f: '[a\' b\' c\'] = 1 / [a b c]', qr: true, e: 'The scalar triple product of reciprocal frame is the inverse of the original.' }
      ]
    },
    {
      s: '3D Lines & Shortest Distance',
      t: 'Parametric coordinates (x₁ + λa, y₁ + λb, z₁ + λc) represent any arbitrary point on a 3D line.',
      i: [
        { n: 'Vector Equation of Line', f: 'r = a + λ b', qr: true, e: 'Line passing through point a and parallel to direction vector b.' },
        { n: 'Cartesian (Symmetric) Form', f: '(x - x₁)/a = (y - y₁)/b = (z - z₁)/c = λ', qr: true, e: 'Point (x₁, y₁, z₁) with direction ratios (a, b, c).' },
        { n: 'Direction Cosine Identity', f: 'l² + m² + n² = 1  ;  sin²α + sin²β + sin²γ = 2', qr: true, e: 'l, m, n are cosines of angles with coordinate axes.' },
        { n: 'Shortest Distance (Skew Lines)', f: 'd = | (a₂ - a₁) · (b₁ × b₂) | / |b₁ × b₂|', qr: true, e: 'Distance between non-intersecting, non-parallel skew lines.' },

let searchQuery = '', quickRevision = false, expandedSections = new Set(), allExpanded = false;

function esc(s) { return String(s).replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function formatMathText(text) {
  const tokens = []; let index = 0;
  const protectedText = text.replace(/<(\/?)(mark|sub|sup)>/g, (m, slash, tag) => {
    const token = `__TAG${index++}__`;
    tokens.push(`<${slash}${tag}>`);
    return token;
  });
  const escaped = protectedText.replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const rendered = escaped
    .replace(/([A-Za-zα-ωΑ-Ω0-9\)\]])_\{([^}]+)\}/g, '$1<sub>$2</sub>')
    .replace(/([A-Za-zα-ωΑ-Ω0-9\)\]])_([A-Za-z0-9]+)/g, '$1<sub>$2</sub>')
    .replace(/\^\(([^)]+)\)/g, '<sup>( $1 )</sup>')
    .replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>')
    .replace(/\^([A-Za-z0-9]+)/g, '<sup>$1</sup>');
  return rendered.replace(/__TAG(\d+)__/g, (_, i) => tokens[Number(i)]);
}

function highlight(text, q) {
  const safeText = esc(text);
  if (!q) return formatMathText(safeText);
  const e = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return formatMathText(safeText.replace(new RegExp(`(${e})`, 'gi'), '<mark>$1</mark>'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show'); clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => showToast('Formula copied!')).catch(() => {});
}

function toggleStar(event, name, formula) {
  event.stopPropagation();
  let starred = JSON.parse(localStorage.getItem('starredFormulas')) || [];
  const idx = starred.findIndex(item => item.formula === formula);
  
  if (idx > -1) {
    starred.splice(idx, 1);
    showToast('Removed from Cheat Sheet');
    event.currentTarget.classList.remove('active');
    event.currentTarget.innerHTML = '<i class="fa-regular fa-star"></i>';
  } else {
    starred.push({ subject: FORMULA_DATA.ti, name: name, formula: formula });
    showToast('Saved to Starred Cheat Sheet!');
    event.currentTarget.classList.add('active');
    event.currentTarget.innerHTML = '<i class="fa-solid fa-star"></i>';
  }
  localStorage.setItem('starredFormulas', JSON.stringify(starred));
}

function isStarred(formula) {
  const starred = JSON.parse(localStorage.getItem('starredFormulas')) || [];
  return starred.some(item => item.formula === formula);
}

function renderContent() {
  const main = document.getElementById('main');
  const q = searchQuery.toLowerCase().trim();
  
  let sectionHtml = '';
  let totalF = 0;
  let activeSections = 0;

  FORMULA_DATA.sections.forEach((sec, si) => {
    const itemsFiltered = sec.i.filter(item => {
      if (item.qrOnly) return false;
      return !q || item.n.toLowerCase().includes(q) || item.f.toLowerCase().includes(q) || (item.e && item.e.toLowerCase().includes(q));
    });

    if (itemsFiltered.length > 0) {
      activeSections++;
      totalF += itemsFiltered.length;
      const key = `${FORMULA_DATA.id}-${si}`;
      const isOpen = expandedSections.has(key) || q;

      sectionHtml += `
        <div class="section">
          <div class="section-header ${isOpen ? 'open' : ''}" data-key="${key}">
            <i class="fa-solid fa-chevron-right sh-icon"></i>
            <span class="sh-title">${highlight(sec.s, searchQuery)}</span>
            <span class="sh-count">${itemsFiltered.length}</span>
            <i class="fa-solid fa-chevron-down sh-arrow"></i>
          </div>
          <div class="section-body ${isOpen ? 'open' : ''}">
            <div class="formula-grid">`;
      
      itemsFiltered.forEach(item => {
        const starClass = isStarred(item.f) ? 'active' : '';
        const starIcon = isStarred(item.f) ? 'fa-solid fa-star' : 'fa-regular fa-star';
        const expBlock = item.e ? `<div class="fc-exp"><i class="fa-solid fa-circle-info"></i> ${highlight(item.e, searchQuery)}</div>` : '';

        sectionHtml += `
          <div class="formula-card" data-formula="${esc(item.f)}" onclick="copyText(this.dataset.formula)">
            <span class="fc-copy"><i class="fa-regular fa-copy"></i></span>
            <span class="fc-star ${starClass}" onclick="toggleStar(event, '${esc(item.n)}', '${esc(item.f)}')">
              <i class="${starIcon}"></i>
            </span>
            <div class="fc-main-row">
              <span class="fc-name">${highlight(item.n, searchQuery)}</span>
              <span class="fc-formula">${highlight(item.f, searchQuery)}</span>
            </div>
            ${expBlock}
          </div>`;
      });

      sectionHtml += `</div>`;
      if (sec.t && !q) {
        sectionHtml += `<div class="jee-tip"><i class="fa-solid fa-lightbulb"></i><span>${sec.t}</span></div>`;
      }
      sectionHtml += `</div></div>`;
    }
  });

  const revisionItems = [];
  FORMULA_DATA.sections.forEach(sec => {
    sec.i.forEach(item => {
      if (item.qr || item.qrOnly) {
        revisionItems.push(item);
      }
    });
  });

  let revisionHtml = `
    <div class="master-sheet ${quickRevision && !q ? 'show-master' : ''}">
      <h2><i class="fa-solid fa-bolt"></i> Master Formula Sheet — ${FORMULA_DATA.ti}</h2>
      <div class="master-grid">`;
  
  revisionItems.forEach(m => {
    revisionHtml += `
      <div class="master-card" data-formula="${esc(m.f)}" onclick="copyText(this.dataset.formula)">
        <span class="mc-concept">${highlight(m.n, searchQuery)}</span>
        <span class="mc-formula">${highlight(m.f, searchQuery)}</span>
      </div>`;
  });
  revisionHtml += `</div></div>`;

  let combinedLayout = `
    <div class="hero">
      <div class="stat-card">
        <div class="sc-label">Section Count</div>
        <div class="sc-val">${FORMULA_DATA.sections.length}</div>
      </div>
      <div class="stat-card">
        <div class="sc-label">Active Formulas</div>
        <div class="sc-val">${totalF}</div>
      </div>
    </div>
    <div class="subject-header">
      <h1><i class="${FORMULA_DATA.ic}"></i> ${FORMULA_DATA.ti}</h1>
      <p>${FORMULA_DATA.d}</p>
    </div>
  `;

  if (quickRevision && !q) {
    combinedLayout += revisionHtml;
  } else {
    combinedLayout += sectionHtml + revisionHtml;
  }

  main.innerHTML = combinedLayout;
}

const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('mode') === 'quick') {
  quickRevision = true;
  document.getElementById('qrBtn').classList.add('active');
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderContent();
});

document.getElementById('main').addEventListener('click', e => {
  const header = e.target.closest('.section-header');
  if (!header) return;
  const key = header.dataset.key;
  if (expandedSections.has(key)) expandedSections.delete(key); else expandedSections.add(key);
  header.classList.toggle('open');
  header.nextElementSibling.classList.toggle('open');
});

document.getElementById('qrBtn').addEventListener('click', () => {
  quickRevision = !quickRevision;
  document.getElementById('qrBtn').classList.toggle('active', quickRevision);
  renderContent();
  showToast(quickRevision ? 'Quick Revision mode on' : 'Full view restored');
});

document.getElementById('expandBtn').addEventListener('click', () => {
  allExpanded = !allExpanded;
  if (allExpanded) {
    FORMULA_DATA.sections.forEach((sec, si) => expandedSections.add(`${FORMULA_DATA.id}-${si}`));
    document.getElementById('expandBtn').innerHTML = '<i class="fa-solid fa-compress"></i> Collapse All';
  } else {
    expandedSections.clear();
    document.getElementById('expandBtn').innerHTML = '<i class="fa-solid fa-expand"></i> Expand All';
  }
  renderContent();
});

document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').style.display = 'block';
});
document.getElementById('overlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').style.display = 'none';
});

const backTop = document.getElementById('backTop');
window.addEventListener('scroll', () => { backTop.classList.toggle('show', window.scrollY > 400); });
backTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

const modal = document.getElementById('modal');
const modalSubject = document.getElementById('modalSubject');
const modalName = document.getElementById('modalName');
const modalFormula = document.getElementById('modalFormula');
let modalRevealed = false;

function showRandomFormula() {
  const allSubFormulas = [];
  FORMULA_DATA.sections.forEach(sec => sec.i.forEach(item => allSubFormulas.push(item)));
  
  const f = allSubFormulas[Math.floor(Math.random() * allSubFormulas.length)];
  modalSubject.textContent = FORMULA_DATA.ti;
  modalSubject.style.color = FORMULA_DATA.c;
  modalName.textContent = f.n;
  modalFormula.textContent = f.f;
  modalFormula.classList.add('hidden-f');
  modalRevealed = false;
  document.getElementById('modalReveal').textContent = 'Reveal';
  modal.classList.add('show');
}

document.getElementById('randomBtn').addEventListener('click', showRandomFormula);
document.getElementById('modalReveal').addEventListener('click', () => {
  if (!modalRevealed) {
    modalFormula.classList.remove('hidden-f');
    modalRevealed = true;
    document.getElementById('modalReveal').textContent = 'Copy';
  } else {
    copyText(modalFormula.textContent);
  }
});
document.getElementById('modalNext').addEventListener('click', showRandomFormula);
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });

expandedSections.add(`${FORMULA_DATA.id}-0`);
renderContent();
</script>
</body>
