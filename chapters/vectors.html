<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEE Formula Vault — Vectors & 3D Geometry (Deep Dive)</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg: #080c14; --bg2: #0e1420; --card: #111827; --card2: #161f30;
  --border: #1c2840; --fg: #e4e8f0; --muted: #5e6e87;
  --accent: #6366f1; /* Indigo Theme */
  --accent-glow: rgba(99, 102, 241, 0.05);
  --accent-mark: rgba(99, 102, 241, 0.25);
  --radius: 10px;
  --tip-bg: rgba(255, 193, 7, 0.06); --tip-text: #ffc107;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; overflow-x: hidden; }
body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse at 20% 0%, var(--accent-glow), transparent 60%); pointer-events: none; z-index: 0; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

#sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 290px; background: var(--bg2); border-right: 1px solid var(--border); z-index: 100; display: flex; flex-direction: column; transition: transform .3s ease; }
.sidebar-head { padding: 1.25rem; border-bottom: 1px solid var(--border); }
.sidebar-head h2 { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: .5rem; }
.sidebar-head h2 i { color: var(--accent); }
.sidebar-head .sub { font-size: .72rem; color: var(--muted); margin-top: .25rem; }

.search-box { padding: .75rem 1rem; position: relative; }
.search-box i { position: absolute; left: 1.65rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: .8rem; }
.search-box input { width: 100%; padding: .55rem .75rem .55rem 2.2rem; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--fg); outline: none; }

.sidebar-actions { padding: 1rem; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: .5rem; margin-top: auto; }
.action-btn { display: flex; align-items: center; justify-content: center; gap: .5rem; padding: .6rem; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--fg); font-size: .8rem; cursor: pointer; text-decoration: none; }
.action-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
.action-btn.active { background: rgba(99, 102, 241, 0.1); border-color: var(--accent); color: var(--accent); }

#main { margin-left: 290px; padding: 2rem 2.5rem 4rem; position: relative; z-index: 1; }
.hero { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: .85rem 1.1rem; flex: 1; min-width: 130px; }
.stat-card .sc-label { font-size: .68rem; color: var(--muted); text-transform: uppercase; }
.stat-card .sc-val { font-size: 1.5rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; margin-top: .15rem; }

.subject-header { margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
.subject-header h1 { font-size: 1.8rem; font-weight: 800; display: flex; align-items: center; gap: .6rem; }

.section { margin-bottom: 1rem; }
.section-header { display: flex; align-items: center; gap: .6rem; padding: .85rem 1rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; }
.section-header .sh-title { font-size: .92rem; font-weight: 600; flex: 1; }
.section-header .sh-count { font-size: .7rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
.section-header .sh-arrow { color: var(--muted); font-size: .7rem; transition: transform .25s; }
.section-header.open .sh-arrow { transform: rotate(180deg); }

.section-body { overflow: hidden; max-height: 0; transition: max-height .35s ease; border: 1px solid transparent; border-top: none; }
.section-body.open { max-height: 20000px; border-color: var(--border); background: var(--bg2); padding-bottom: 1rem; border-radius: 0 0 var(--radius) var(--radius); }

.formula-grid { padding: .75rem; display: grid; grid-template-columns: 1fr; gap: .6rem; }
.formula-card { display: flex; flex-direction: column; gap: .25rem; padding: .75rem .9rem; background: rgba(255, 255, 255, .015); border: 1px solid rgba(255, 255, 255, .04); border-radius: 8px; position: relative; cursor: pointer; }
.formula-card:hover { background: rgba(255, 255, 255, .035); border-color: rgba(255, 255, 255, .08); }

.fc-main-row { display: flex; align-items: flex-start; gap: .75rem; width: 100%; }
.fc-name { font-size: .8rem; color: var(--muted); min-width: 180px; flex-shrink: 0; font-weight: 600; }
.fc-formula { font-family: 'JetBrains Mono', monospace; font-size: .82rem; color: var(--fg); flex-grow: 1; }
.fc-exp { font-size: 0.74rem; color: #94a3b8; margin-top: 0.25rem; border-left: 1px solid var(--accent); padding-left: 0.5rem; }

.jee-tip { margin: .5rem .75rem; padding: .65rem .85rem; background: var(--tip-bg); border-radius: 8px; font-size: .78rem; color: var(--tip-text); display: flex; gap: .5rem; }

#toast { position: fixed; bottom: 2rem; right: 2rem; padding: .65rem 1.1rem; background: var(--card2); border: 1px solid var(--accent); border-radius: 8px; color: var(--accent); opacity: 0; transition: .25s; pointer-events: none; }
#toast.show { opacity: 1; transform: translateY(-10px); }

#menuBtn { display: none; position: fixed; top: 1rem; left: 1rem; z-index: 200; width: 40px; height: 40px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); color: var(--fg); }

@media(max-width:860px){
  #sidebar { transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); }
  #menuBtn { display: flex; align-items: center; justify-content: center; }
  #main { margin-left: 0; padding: 4rem 1rem; }
  .fc-main-row { flex-direction: column; }
  .fc-name { min-width: 100%; }
}
</style>
</head>
<body>

<button id="menuBtn"><i class="fa-solid fa-bars"></i></button>

<aside id="sidebar">
  <div class="sidebar-head">
    <h2><i class="fa-solid fa-layer-group"></i> Vector Vault</h2>
    <div class="sub">Advanced 3D Geometry & Vectors</div>
  </div>
  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" id="searchInput" placeholder="Search 50+ formulas...">
  </div>
  <div style="padding: 0 1rem;"><a href="../index.html" class="action-btn"><i class="fa-solid fa-house"></i> Home</a></div>
  <div class="sidebar-actions">
    <button class="action-btn" id="qrBtn"><i class="fa-solid fa-bolt"></i> Quick Revision</button>
    <button class="action-btn" id="expandBtn"><i class="fa-solid fa-expand"></i> Expand All</button>
  </div>
</aside>

<main id="main">
  <div class="hero">
    <div class="stat-card"><div class="sc-label">Sub-Topics</div><div class="sc-val" style="color:var(--accent)">9</div></div>
    <div class="stat-card"><div class="sc-label">Total Formulas</div><div class="sc-val" id="totalFormulaCount">0</div></div>
  </div>
  <div class="subject-header">
    <h1>Vectors & 3D Geometry (Complete)</h1>
    <p>Comprehensive reference covering Vector Algebra, STP, VTP, Lines, Planes, and Point-Plane interactions.</p>
  </div>
  <div id="content"></div>
</main>

<div id="toast">Copied to clipboard!</div>

<script>
const DATA = [
  {
    s: 'Vector Fundamentals & Dot Product',
    t: 'JEE Trap: Scalar projection is a scalar (a.b/|b|), but vector projection is a vector (a.b/|b|^2)b.',
    i: [
      { n: 'Modulus/Magnitude', f: '|a⃗| = √(a₁² + a₂² + a₃²)', qr: true, e: 'Length of vector a = a₁i + a₂j + a₃k.' },
      { n: 'Unit Vector', f: 'â = a⃗ / |a⃗|', qr: true, e: 'A vector with magnitude 1 in the direction of a.' },
      { n: 'Dot Product', f: 'a⃗ · b⃗ = |a⃗||b⃗| cos θ', qr: true, e: 'If a ⊥ b, then a · b = 0. Also a · a = |a|².' },
      { n: 'Scalar Projection', f: 'Proj_a_on_b = (a⃗ · b⃗) / |b⃗|', e: 'The length of the shadow of a onto b.' },
      { n: 'Vector Projection', f: 'VProj_a_on_b = [(a⃗ · b⃗) / |b⃗|²] b⃗', e: 'The vector component of a in the direction of b.' },
      { n: 'Direction Cosines (Vector)', f: 'cos α = a₁/|a⃗|, cos β = a₂/|a⃗|, cos γ = a₃/|a⃗|', e: 'Angles vector makes with X, Y, Z axes respectively.' },
      { n: 'Parallelogram Law', f: '|a⃗ + b⃗|² + |a⃗ - b⃗|² = 2(|a⃗|² + |b⃗|²)', e: 'Relates diagonals and sides of a parallelogram.' }
    ]
  },
  {
    s: 'Cross Product & Geometry',
    t: 'Order matters! a × b = -(b × a). Use cross product to find a vector perpendicular to a plane.',
    i: [
      { n: 'Cross Product (Vector)', f: 'a⃗ × b⃗ = |a⃗||b⃗| sin θ n̂', qr: true, e: 'n̂ is the unit normal vector perpendicular to a and b.' },
      { n: 'Cross Product (Coord)', f: 'a⃗ × b⃗ = det|i j k; a₁ a₂ a₃; b₁ b₂ b₃|', qr: true, e: 'Determinant form for calculation.' },
      { n: 'Area of Parallelogram', f: 'Area = |a⃗ × b⃗|', e: 'Where a and b are adjacent side vectors.' },
      { n: 'Area of Triangle', f: 'Area = ½ |a⃗ × b⃗|', qr: true, e: 'Half the area of the corresponding parallelogram.' },
      { n: 'Unit Normal to Plane', f: 'n̂ = ± (a⃗ × b⃗) / |a⃗ × b⃗|', e: 'Vector perpendicular to the plane containing a and b.' },
      { n: 'Lagrange\'s Identity', f: '|a⃗ × b⃗|² = |a⃗|²|b⃗|² - (a⃗ · b⃗)²', qr: true, e: 'Connects dot and cross product magnitudes.' }
    ]
  },
  {
    s: 'Triple Products (STP & VTP)',
    t: 'STP [a b c] = 0 means vectors are coplanar. This is the most common JEE question.',
    i: [
      { n: 'Scalar Triple Product', f: '[a⃗ b⃗ c⃗] = a⃗ · (b⃗ × c⃗) = det|a; b; c|', qr: true, e: 'Volume of parallelepiped. Cyclic order: [a b c] = [b c a] = [c a b].' },
      { n: 'Volume of Tetrahedron', f: 'V = ⅙ |[a⃗ b⃗ c⃗]|', e: 'Where a, b, c are coterminous edge vectors from one vertex.' },
      { n: 'Vector Triple Product', f: 'a⃗ × (b⃗ × c⃗) = (a⃗ · c⃗) b⃗ - (a⃗ · b⃗) c⃗', qr: true, e: 'Memory tip: (Middle · Outer) - (Outer · Middle). Result lies in plane of b and c.' },
      { n: 'Scalar Product of 4 Vectors', f: '(a⃗ × b⃗) · (c⃗ × d⃗) = (a⃗·c⃗)(b⃗·d⃗) - (a⃗·d⃗)(b⃗·c⃗)', e: 'Also known as Binet-Cauchy identity in vector form.' },
      { n: 'Vector Product of 4 Vectors', f: '(a⃗ × b⃗) × (c⃗ × d⃗) = [a⃗ b⃗ d⃗] c⃗ - [a⃗ b⃗ c⃗] d⃗', e: 'Expresses the product in terms of vectors c and d.' }
    ]
  },
  {
    s: 'Reciprocal System of Vectors',
    t: 'Advanced Topic: a · a\' = b · b\' = c · c\' = 1. All other dot products are zero.',
    i: [
      { n: 'Reciprocal Vector a\'', f: 'a⃗\' = (b⃗ × c⃗) / [a⃗ b⃗ c⃗]', e: 'Defined such that it is perpendicular to b and c.' },
      { n: 'Reciprocal Vector b\'', f: 'b⃗\' = (c⃗ × a⃗) / [a⃗ b⃗ c⃗]', e: 'Defined such that it is perpendicular to c and a.' },
      { n: 'Reciprocal Vector c\'', f: 'c⃗\' = (a⃗ × b⃗) / [a⃗ b⃗ c⃗]', e: 'Defined such that it is perpendicular to a and b.' },
      { n: 'Property of STP', f: '[a⃗\' b⃗\' c⃗\'] = 1 / [a⃗ b⃗ c⃗]', e: 'Volume of reciprocal parallelepiped is the inverse of the original.' }
    ]
  },
  {
    s: '3D Lines',
    t: 'Skew lines are neither parallel nor intersecting. Their shortest distance is non-zero.',
    i: [
      { n: 'Line: Vector Form', f: 'r⃗ = a⃗ + λ b⃗', qr: true, e: 'a = point vector, b = direction vector.' },
      { n: 'Line: Cartesian Form', f: '(x-x₁)/a = (y-y₁)/b = (z-z₁)/c', qr: true, e: '(x₁,y₁,z₁) is a point, (a,b,c) are direction ratios.' },
      { n: 'Angle between Lines', f: 'cos θ = |(b₁⃗ · b₂⃗) / (|b₁⃗||b₂⃗|)|', e: 'Angle depends only on the direction vectors b₁ and b₂.' },
      { n: 'Shortest Dist (Skew)', f: 'SD = |(a₂⃗ - a₁⃗) · (b₁⃗ × b₂⃗)| / |b₁⃗ × b₂⃗|', qr: true, e: 'Distance between r=a₁+λb₁ and r=a₂+μb₂.' },
      { n: 'Shortest Dist (Parallel)', f: 'SD = |(a₂⃗ - a₁⃗) × b⃗| / |b⃗|', e: 'Used when direction vectors are same (b₁=b₂=b).' },
      { n: 'Intersection of 2 Lines', f: 'Equate x, y, z components; solve for λ and μ. Check in 3rd equation.', e: 'Standard procedural method for JEE.' }
    ]
  },
  {
    s: '3D Planes',
    t: 'The coefficients (a, b, c) in ax+by+cz+d=0 are the DRs of the NORMAL to the plane.',
    i: [
      { n: 'Normal Form', f: 'lx + my + nz = p', e: 'l,m,n are DCs; p is perp distance from origin.' },
      { n: 'One Point Form', f: 'a(x-x₁) + b(y-y₁) + c(z-z₁) = 0', qr: true, e: 'Plane thru (x₁,y₁,z₁) with normal (a,b,c).' },
      { n: 'Intercept Form', f: 'x/a + y/b + z/c = 1', e: 'a, b, c are intercepts on X, Y, Z axes.' },
      { n: 'Angle between 2 Planes', f: 'cos θ = |n₁·n₂| / (|n₁||n₂|)', e: 'Same as angle between their normal vectors.' },
      { n: 'Plane thru Intersection', f: 'P₁ + λ P₂ = 0', e: 'Family of planes passing through the line of intersection of P₁ and P₂.' },
      { n: 'Angle Bisectors (Planes)', f: '(a₁x+b₁y+c₁z+d₁)/√(Σa₁²) = ±(a₂x+b₂y+c₂z+d₂)/√(Σa₂²)', e: 'Equations of the two bisecting planes.' }
    ]
  },
  {
    s: 'Point, Line & Plane Interaction',
    t: 'Image of a point in a plane is a very frequent JEE question. The formula is identical to 2D but with z.',
    i: [
      { n: 'Point to Plane Dist', f: 'd = |ax₁+by₁+cz₁+d| / √(a²+b²+c²)', qr: true, e: 'Perpendicular distance from (x₁,y₁,z₁) to ax+by+cz+d=0.' },
      { n: 'Foot of Perpendicular', f: '(x-x₁)/a = (y-y₁)/b = (z-z₁)/c = -(ax₁+by₁+cz₁+d)/(a²+b²+c²)', qr: true, e: 'Coordinates of point on plane nearest to (x₁,y₁,z₁).' },
      { n: 'Image of Point', f: '(x-x₁)/a = (y-y₁)/b = (z-z₁)/c = -2(ax₁+by₁+cz₁+d)/(a²+b²+c²)', qr: true, e: 'Note the factor of -2 (vs -1 for foot).' },
      { n: 'Angle: Line & Plane', f: 'sin θ = |(b⃗ · n̂) / (|b⃗||n̂|)|', qr: true, e: 'Uses "sin" because we measure angle with plane, but vector n is perpendicular to it.' },
      { n: 'Condition: Line in Plane', f: 'a·x₁ + b·y₁ + c·z₁ + d = 0 AND a·l + b·m + c·n = 0', e: 'Point must lie in plane AND line must be perpendicular to normal.' }
    ]
  },
  {
    s: 'Vector Equations (Solving for r)',
    t: 'Solving for unknown vector r given r.a = k and r x b = c.',
    i: [
      { n: 'Solution Type 1', f: 'r⃗ · a⃗ = k => r⃗ = (k/|a⃗|²) a⃗ + (a⃗ × m⃗)', e: 'General solution where m is any vector.' },
      { n: 'Solution Type 2', f: 'r⃗ × a⃗ = b⃗ => r⃗ = (b⃗ × a⃗)/|a⃗|² + λ a⃗', e: 'Solving cross product equations.' },
      { n: 'Linear Combination', f: 'r⃗ = x a⃗ + y b⃗ + z (a⃗ × b⃗)', e: 'Standard basis for 3D space using two non-parallel vectors.' }
    ]
  },
  {
    s: 'Sphere Basics',
    t: 'Equation looks like a circle but with three variables.',
    i: [
      { n: 'Standard Equation', f: '(x-h)² + (y-k)² + (z-l)² = R²', e: 'Center (h,k,l), Radius R.' },
      { n: 'General Equation', f: 'x²+y²+z² + 2ux + 2vy + 2wz + d = 0', e: 'Center (-u,-v,-w), Radius = √(u²+v²+w²-d).' },
      { n: 'Diameter Form', f: '(x-x₁)(x-x₂) + (y-y₁)(y-y₂) + (z-z₁)(z-z₂) = 0', e: 'Sphere with (x₁,y₁,z₁) and (x₂,y₂,z₂) as diameter endpoints.' }
    ]
  }
];

function render() {
  const container = document.getElementById('content');
  const q = document.getElementById('searchInput').value.toLowerCase();
  let html = '';
  let count = 0;

  DATA.forEach((sec, si) => {
    const filtered = sec.i.filter(item => !q || item.n.toLowerCase().includes(q) || item.f.toLowerCase().includes(q));
    if (filtered.length === 0) return;

    count += filtered.length;
    const isOpen = q.length > 0 || document.getElementById('expandBtn').innerText.includes('Collapse');
    
    html += `
      <div class="section">
        <div class="section-header ${isOpen ? 'open' : ''}" onclick="this.classList.toggle('open'); this.nextElementSibling.classList.toggle('open')">
          <span class="sh-title">${sec.s}</span>
          <span class="sh-count">${filtered.length}</span>
          <i class="fa-solid fa-chevron-down sh-arrow"></i>
        </div>
        <div class="section-body ${isOpen ? 'open' : ''}">
          <div class="formula-grid">
            ${filtered.map(item => `
              <div class="formula-card" onclick="copyText('${item.f}')">
                <div class="fc-main-row">
                  <span class="fc-name">${item.n}</span>
                  <span class="fc-formula">${item.f}</span>
                </div>
                <div class="fc-exp">${item.e}</div>
              </div>
            `).join('')}
          </div>
          ${!q && sec.t ? `<div class="jee-tip"><i class="fa-solid fa-lightbulb"></i><span>${sec.t}</span></div>` : ''}
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
  document.getElementById('totalFormulaCount').innerText = count;
}

function copyText(text) {
  navigator.clipboard.writeText(text);
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

document.getElementById('searchInput').oninput = render;
document.getElementById('expandBtn').onclick = function() {
  const isExpanding = this.innerText.includes('Expand');
  this.innerHTML = isExpanding ? '<i class="fa-solid fa-compress"></i> Collapse All' : '<i class="fa-solid fa-expand"></i> Expand All';
  render();
};
document.getElementById('menuBtn').onclick = () => document.getElementById('sidebar').classList.toggle('open');

document.getElementById('qrBtn').onclick = function() {
  const active = this.classList.toggle('active');
  const q = document.getElementById('searchInput');
  if(active) {
    DATA.forEach(s => s.i = s.i.filter(item => item.qr));
  } else {
    location.reload(); // Simplest way to reset the data object
  }
  render();
};

render();
</script>
</body>
</html>
